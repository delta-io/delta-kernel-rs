# Reconciles a PR's native merge request with its `automerge` label. The label is the merge
# request: its latest active application must come from an actor with write access. Before asking
# GitHub to merge when ready, the controller removes a recognized generated git-stack prefix from
# the description once; applying the label declares the description final. Removing the label
# cancels waiting or dequeues where GitHub still allows it. Readiness stays with GitHub's required
# checks, reviews, and merge queue; nothing here bypasses them. CONTRIBUTING.md has the
# contributor-facing rules.
#
# pull_request_target runs in the base repository with a write-capable token so fork PRs work. It
# must only execute trusted base-branch code: never check out or run the PR head.
name: Automerge

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  # Serialize runs per PR without cancelling an in-flight mutation. Each run reads live state, so
  # a stale delivery cannot restore an older label application over current intent.
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.label.name == 'automerge' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Reconcile merge request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/automerge.py --repository "$REPO" --pr "$PR_NUMBER"
