name: unity-catalog-test

# Runs the gated `unity-catalog-delta-rest-client` and `delta-kernel-unity-catalog` live
# integration tests against a real Unity Catalog server (built from a pinned commit). Exercises the
# read-only `get_config` handshake (needs no table), `load_table` against a table seeded via the
# Delta-Commits (legacy) API before the test step, and the mutating create tests against the
# throwaway server.
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "delta-kernel-unity-catalog/**"
      - "unity-catalog-delta-client-api/**"
      - "unity-catalog-delta-rest-client/**"
      - ".github/workflows/unitycatalog_test.yml"
      - ".github/scripts/setup_unitycatalog.sh"
      - ".github/scripts/uc_server.sh"
      - ".github/scripts/seed_uc_table.sh"
  pull_request:
    paths:
      - "delta-kernel-unity-catalog/**"
      - "unity-catalog-delta-client-api/**"
      - "unity-catalog-delta-rest-client/**"
      - ".github/workflows/unitycatalog_test.yml"
      - ".github/scripts/setup_unitycatalog.sh"
      - ".github/scripts/uc_server.sh"
      - ".github/scripts/seed_uc_table.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  UC_COMMIT: 0f1445227bd251b386420c90136515daefa4e03d
  UC_DIR: ${{ github.workspace }}/.uc-server

jobs:
  uc-test:
    name: UC server integration test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Java 17
        uses: actions/setup-java@v3.14.1
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: nextest

      - name: Cache Unity Catalog build
        uses: actions/cache@v4.3.0
        with:
          path: |
            ${{ env.UC_DIR }}
            ~/.ivy2
            ~/.sbt
            ~/.cache/coursier
          key: uc-${{ runner.os }}-${{ env.UC_COMMIT }}-${{ hashFiles('.github/scripts/setup_unitycatalog.sh') }}

      - name: Build Unity Catalog server
        run: bash .github/scripts/setup_unitycatalog.sh

      - name: Start Unity Catalog server
        run: bash .github/scripts/uc_server.sh start

      # Seed a catalog-managed (MANAGED) Delta table so the load_table live test has a table to read.
      - name: Seed a managed table
        run: bash .github/scripts/seed_uc_table.sh unity default smoke_test_table

      - name: Run UC live integration tests
        env:
          UC_SERVER_URL: http://localhost:8080
          UC_TOKEN: not-used
          # Fresh server seeds the `unity` catalog with a `default` schema.
          UC_TEST_CATALOG: unity
          UC_TEST_SCHEMA: default
          UC_TEST_TABLE: smoke_test_table
        # Live tests are `#[ignore]` so a normal `cargo nextest` reports them as skipped rather than
        # passing. `--run-ignored only -E 'test(live_)'` runs exactly the ignored live tests here,
        # where a UC server is available.
        run: cargo nextest run --locked -p unity-catalog-delta-rest-client -p delta-kernel-unity-catalog --features integration-test --run-ignored only -E 'test(live_)'

      - name: Stop Unity Catalog server
        if: always()
        run: bash .github/scripts/uc_server.sh stop

      - name: Dump server log on failure
        if: failure()
        run: cat "$UC_DIR/uc-server.log" || true
