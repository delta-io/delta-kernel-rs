name: user-guide

# Restrict push to long-lived branches to avoid duplicate CI runs. See .github/CLAUDE.md.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:

concurrency:
  # A new push to a PR cancels that PR's in-flight run. Non-PR events (push, merge_group) have
  # no head_ref, so run_id (always unique) is used and those runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin the link checker for compatibility with mdBook's JSON format.
  # Validate the guide when updating this version or the install-action commit.
  MDBOOK_LINKCHECK_VERSION: "0.13.0"

jobs:
  user-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install minimal stable
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false
      # See build.yml top-level comment for why save-if is restricted to main and why
      # cache-bin is disabled.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          # make test cleans target to avoid duplicate .rmeta files; cache only dependency sources.
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # mdbook: builds and serves the book.
      # mdbook-mermaid: preprocessor that renders ```mermaid blocks as diagrams.
      # mdbook-linkcheck2: backend that checks internal links and section anchors.
      # install-action's pinned manifests select the mdBook and mdbook-mermaid versions.
      - uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        env:
          # Use upstream release binaries, with a locked source build if no asset is available.
          BINSTALL_STRATEGIES: crate-meta-data,compile
        with:
          tool: mdbook,mdbook-mermaid,mdbook-linkcheck2@${{ env.MDBOOK_LINKCHECK_VERSION }}
          # The link checker is outside install-action's tool catalog.
          fallback: cargo-binstall
      # book.toml makes mdbook-linkcheck2 optional for local builds. Require a runnable executable
      # at the requested version so CI cannot silently skip link checks.
      - name: Verify link checker
        shell: bash
        run: |
          version=$("${CARGO_HOME:-$HOME/.cargo}/bin/mdbook-linkcheck2" --version)
          echo "$version"
          test "$version" = "mdbook-linkcheck2 ${MDBOOK_LINKCHECK_VERSION}"
      # Compiles every Rust code block in the guide via mdbook test, using the
      # kernel deps that the Makefile builds first.
      - name: Test that all code examples compile
        working-directory: docs/user-guide
        run: make test
      # Renders the book to HTML; with [output.linkcheck2] in book.toml this
      # also runs mdbook-linkcheck2, so broken internal links fail CI here.
      - name: Build the book
        working-directory: docs/user-guide
        run: mdbook build
