# =============================================================================
# AI PR Review — Omnigent-powered reviewer for GitHub PRs.
#
# Adapted from omnigent-ai/omnigent's .github/workflows/polly-review.yml for a
# standalone (non-Omnigent) repo. It spins up a local Omnigent server + runner
# inside the CI runner and runs ONE headless review turn: a kernel-review
# orchestrator (.github/omnigent/reviewer/) fans the PR diff out to specialized
# reviewer sub-agents, consolidates their findings, and (optionally) posts the
# review as a PR comment.
#
# Setup (Settings -> Environments -> `ai-review`), as ENVIRONMENT secrets so they
# can be gated behind protection rules such as required reviewers:
#   LLM_API_KEY       Bearer token for your LLM gateway (or Anthropic API key).
#   GATEWAY_BASE_URL  Gateway base URL, e.g. https://<host>/serving-endpoints
# Required repo variable (Settings -> Secrets and variables -> Actions -> Variables):
#   GATEWAY_HOST      Bare hostname of GATEWAY_BASE_URL, for the egress allowlist.
#                     The job fails fast if this is unset -- without it the egress
#                     block silently does nothing.
# Optional (named-bot comments):
#   vars.OMNIGENT_BOT_APP_ID + secrets.OMNIGENT_BOT_APP_KEY
#
# Use a narrowly-scoped, rotatable gateway token with a spend cap -- not a broad
# principal -- so a leak is cheap to contain.
#
# The review never runs automatically: it is triggered only by a `/review` comment
# from a write-access maintainer (OWNER/MEMBER/COLLABORATOR) or a manual dispatch.
# =============================================================================
name: AI PR Review

on:
  # Maintainer-initiated only: a `/review` comment from a write-access user, or a
  # manual dispatch. There is deliberately no `pull_request` trigger -- the review
  # never runs automatically.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hold LLM_API_KEY / GATEWAY_BASE_URL as ENVIRONMENT secrets (not plain repo
    # secrets) so they are scoped to this environment rather than every workflow.
    # Create it under Settings -> Environments -> `ai-review` and add the secrets
    # there; this line does nothing until that exists.
    #
    # The `ai-review` environment scopes LLM_API_KEY / GATEWAY_BASE_URL to this job.
    # For an extra per-run human approval, add required reviewers to that
    # environment (Settings -> Environments -> `ai-review`); since the only entry
    # points are already maintainer-gated, that is optional belt-and-suspenders.
    environment: ai-review
    # Maintainer-initiated only: a `/review` comment from a write-access user
    # (OWNER/MEMBER/COLLABORATOR) on a PR, or a manual workflow dispatch.
    if: >-
      !cancelled() && (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '/review') &&
          !endsWith(github.actor, '[bot]') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      # An unset GATEWAY_HOST would render a bare `:443` into the allowlist below.
      # harden-runner cannot resolve that, reverts the firewall, and exits -- while
      # the job keeps running with NO egress restriction and still reports green.
      # Fail loudly here instead of silently losing the control.
      - name: Require GATEWAY_HOST for the egress allowlist
        env:
          GATEWAY_HOST: ${{ vars.GATEWAY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${GATEWAY_HOST}" ]; then
            echo "::error::Repo variable GATEWAY_HOST is not set. It must be the bare" \
                 "hostname of GATEWAY_BASE_URL (no scheme or path), e.g." \
                 "gateway.example.com. Refusing to run without egress limits."
            exit 1
          fi
          case "${GATEWAY_HOST}" in
            *://*|*/*) echo "::error::GATEWAY_HOST must be a bare hostname, got '${GATEWAY_HOST}'."; exit 1 ;;
          esac

      # Restrict outbound network traffic for the whole job. The reviewer reads an
      # untrusted, PR-authored diff and can run shell commands, so telling it not
      # to make network calls is not enough -- egress is denied at the runner and
      # anything off the allowlist surfaces in the run's harden-runner report.
      # `disable-sudo-and-containers` matters as much as the allowlist: without it
      # the agent could just `sudo iptables -F OUTPUT` and undo the firewall.
      # Note the rules are IPv4-only, so this raises the bar rather than sealing it.
      - name: Restrict egress
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Endpoints the job legitimately needs: the GitHub API (diff + comment),
          # the setup-uv/setup-python version manifests and release assets, PyPI
          # (omnigent install), and the LLM gateway. Re-derive with
          # `egress-policy: audit` if a dependency starts reaching somewhere new.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            ${{ vars.GATEWAY_HOST }}:443

      - name: Validate /review command
        id: trigger
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          # `/review` must be a command (first non-space token on a line).
          if ! grep -qE '^[[:space:]]*/review([[:space:]]|$)' <<<"$COMMENT_BODY"; then
            echo "::notice::Comment mentions '/review' but not as a command; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # React with eyes to acknowledge the trigger.
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || true
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check LLM credentials available
        if: steps.trigger.outputs.skip != 'true'
        id: creds
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::notice::Skipping AI review — no LLM credentials (secret unset or \`ai-review\` environment not configured)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            # Mask the key so the runner redacts it from any log that echoes it —
            # defense-in-depth against prompt injection that tries to exfil it.
            echo "::add-mask::${LLM_API_KEY}"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR number
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        id: pr
        env:
          # Pass event data through env, not ${{ }} interpolation in the script,
          # to avoid expression injection. ISSUE_NUMBER is an integer; DISPATCH_PR
          # is a free-form workflow_dispatch string, so env is a must.
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            issue_comment)     n="$ISSUE_NUMBER" ;;
            workflow_dispatch) n="$DISPATCH_PR" ;;
            *)                 echo "::error::Unexpected event '$EVENT_NAME'."; exit 1 ;;
          esac
          # Reject anything that is not a positive integer before it flows on.
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::Resolved PR number '$n' is not numeric."; exit 1
          fi
          echo "pr_number=$n" >> "$GITHUB_OUTPUT"

      # Always check out the DEFAULT branch (trusted). The PR diff is fetched via
      # the API — we never execute PR-authored code in this privileged workflow.
      - name: Check out repo
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Check out the open-source delta-io/delta repo so the protocol reviewer can
      # cross-check against the delta-spark implementation and PROTOCOL.md. Public
      # repo, shallow, into a fixed path the reviewer prompt points at. github.com
      # is already on the harden-runner egress allowlist.
      - name: Check out delta-io/delta (delta-spark reference)
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: delta-io/delta
          ref: master
          path: .delta-oss
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install Omnigent
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        env:
          # Pin the version for reproducible, reviewable CI (supply-chain policy:
          # dependency-resolving commands must not silently pull a newer release).
          # Bump deliberately; `uv tool install omnigent && omnigent --version`
          # locally to see what is current before changing this.
          OMNIGENT_VERSION: "0.8.2"
        run: |
          # Published PyPI package. Add extras in brackets only if your agent
          # needs them, e.g. omnigent[anthropic]. The orchestrator and all its
          # reviewer sub-agents run on the claude-sdk harness — none is a native
          # coding CLI (Claude Code / Codex), so the SDK talks to the gateway
          # directly and those CLI install steps are intentionally absent.
          uv tool install --python 3.12 "omnigent==${OMNIGENT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Omnigent provider config
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          MODEL: ${{ vars.MODEL }}
        run: |
          mkdir -p "$HOME/.omnigent"
          # Written with python (stdlib json) to avoid interpolating secrets/URLs
          # into a heredoc. JSON is valid YAML, so no PyYAML needed.
          #
          # This block targets an LLM gateway that fronts Anthropic models. Set
          # MODEL (repo variable) to the model id your gateway exposes. For a raw
          # Anthropic key instead, set GATEWAY_BASE_URL to "https://api.anthropic.com"
          # and MODEL to a public Anthropic model id (e.g. claude-opus-4-1).
          python3 -c "
          import pathlib, os, json
          gw = os.environ['GATEWAY_BASE_URL']
          model = os.environ.get('MODEL') or 'claude-opus-4-1'
          host = gw.removesuffix('/serving-endpoints')
          cfg = {
              'providers': {
                  'gateway': {
                      'kind': 'gateway',
                      'default': ['anthropic'],
                      'anthropic': {
                          'base_url': gw + '/anthropic',
                          'api_key_ref': 'env:LLM_API_KEY',
                          'models': {'default': model},
                      },
                  }
              }
          }
          pathlib.Path.home().joinpath('.omnigent', 'config.yaml').write_text(
              json.dumps(cfg, indent=2)
          )
          "

      - name: Collect PR context and build review prompt
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Fetch the full diff to a file — the agent reads it from disk at review
          # time (not embedded in the CLI arg), so large PRs don't hit ARG_MAX.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.v3.diff" \
            > /tmp/pr_diff.txt || true

          # Fetch PR metadata for the prompt header.
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json title,body,baseRefName,headRefName,additions,deletions,changedFiles \
            > /tmp/pr_meta.json

          # Build the review prompt. THIS is the "custom system prompt" — the
          # per-run review policy. Edit the `prompt` string below for this repo.
          python3 -u <<'PYEOF'
          import json, pathlib

          meta = json.loads(pathlib.Path("/tmp/pr_meta.json").read_text())
          body = (meta.get("body") or "")[:4096]

          prompt = f"""Orchestrate a review of this pull request.

          ## PR Metadata
          - **Title:** {meta['title']}
          - **Branch:** {meta['headRefName']} -> {meta['baseRefName']}
          - **Stats:** +{meta['additions']} / -{meta['deletions']} across {meta['changedFiles']} file(s)

          ## PR Description
          {body}

          ## Instructions

          The full PR diff is at `/tmp/pr_diff.txt` and the repository is checked
          out at the current working directory (the default branch). Fan the
          review out to your reviewer sub-agents per your roster, pass each the
          diff and this metadata, collect their findings, and consolidate them
          into one review following your output contract.

          Keep signal high — this repo has a strict AI policy, so false positives
          erode trust; err heavily toward silence. Before calling anything
          blocking, verify it is REAL and PRESENT in the diff. Do NOT comment on
          style a linter (rustfmt/clippy) already catches, and do NOT restate the
          diff. "No blocking issues" is a fine review.

          IMPORTANT: your output is posted verbatim as a PR comment. Output ONLY
          the final consolidated review — no narration, no status updates, no
          referring to "sub-agents" or "waiting for results". Begin your response
          with the exact marker <!-- AI_REVIEW_START --> on its own line, then the
          review. Nothing before the marker will be shown.
          """
          pathlib.Path("/tmp/review_prompt.txt").write_text(prompt)
          PYEOF

      - name: Mint App token
        id: app-token
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true' && vars.OMNIGENT_BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.OMNIGENT_BOT_APP_ID }}
          private-key: ${{ secrets.OMNIGENT_BOT_APP_KEY }}

      - name: Run AI review
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        id: review
        env:
          # Scope the key to THIS step only -- do NOT write it to $GITHUB_ENV,
          # which would hand it to every later step too (notably the comment-posting
          # step, which holds a GH App token and writes to the PR).
          # This limits cross-step exposure, NOT the agent itself: omnigent runs as a
          # child of this step and inherits the key by design (the provider config
          # resolves `env:LLM_API_KEY`). Containment against an injected prompt in the
          # diff comes from the egress block, not from this scoping.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          prompt=$(cat /tmp/review_prompt.txt)

          # Run headlessly with -p: starts a local server, sends one turn, prints
          # the assistant response, exits. --no-session: ephemeral, no state.
          # `omnigent` is on PATH from the tool install above (there is no uv
          # project at repo root, so `uv run` is not the right invocation).
          omnigent run .github/omnigent/reviewer/ \
            -p "$prompt" \
            --no-session \
            2>review-stderr.log \
            | tee /tmp/review_output.txt \
            || { echo "::warning::AI review exited non-zero"; cat review-stderr.log; }

          # Strip anything before the sentinel marker so no preamble/narration
          # leaks into the comment. If the marker is absent, fall back to the
          # first markdown heading; if neither is found, emit empty (post skipped).
          # Cap by CHARACTERS here (not a byte `head -c`, which can split a
          # multibyte UTF-8 char and corrupt the comment).
          python3 -c "
          import re, pathlib
          raw = pathlib.Path('/tmp/review_output.txt').read_text()
          sentinel = '<!-- AI_REVIEW_START -->'
          idx = raw.find(sentinel)
          if idx >= 0:
              cleaned = raw[idx + len(sentinel):].lstrip('\n')
          else:
              m = re.search(r'^#{1,6} ', raw, re.MULTILINE)
              cleaned = raw[m.start():] if m else ''
          pathlib.Path('/tmp/review_output.txt').write_text(cleaned[:60000])
          "

          # Random delimiter so model output can't truncate the GITHUB_OUTPUT var.
          delim="REVIEW_$(openssl rand -hex 8)"
          echo "review_text<<${delim}" >> "$GITHUB_OUTPUT"
          cat /tmp/review_output.txt >> "$GITHUB_OUTPUT"
          echo "${delim}" >> "$GITHUB_OUTPUT"

      - name: Scan review output for secrets before posting
        if: steps.trigger.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          # Abort if the output contains the literal API key — catches prompt
          # injection that tricks the model into echoing the secret. Keep this.
          if [ -n "$LLM_API_KEY" ] && grep -qF "$LLM_API_KEY" /tmp/review_output.txt 2>/dev/null; then
            echo "::error::Review output contains LLM_API_KEY — aborting post to prevent secret exfiltration."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # OUTPUT MODE. Pick ONE. See the porting guide for the full menu.
      #
      #  (1) Dark launch — artifact only, no PR comment. For evaluation.
      #      Delete the "Post review comment" step below and set the upload step
      #      to run always (change `if: failure()` to `if: always()`).
      #  (2) Collapsed comment — wrap $REVIEW_TEXT in <details> (shown below,
      #      commented out) so it never bloats the PR thread.
      #  (3) Full inline comment — the default below.
      # -----------------------------------------------------------------------
      - name: Post review comment
        if: steps.review.outputs.review_text != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REVIEW_TEXT: ${{ steps.review.outputs.review_text }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          # REVIEW_TEXT is passed via env (not expression interpolation) to avoid
          # expression injection.
          {
            echo "<!-- ai-review-bot -->"
            echo "## 🤖 AI Review <sub>(draft — human review required)</sub>"
            echo ""
            # --- Collapsed variant (option 2): uncomment these two lines and the
            # --- matching </details> below to hide the review by default.
            # echo "<details><summary>Show review</summary>"
            # echo ""
            echo "$REVIEW_TEXT"
            echo ""
            # echo "</details>"
            echo "---"
            echo "<sub>Automated review · [workflow run](${RUN_URL})</sub>"
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
          echo "Posted review comment."

      - name: Upload logs
        # For DARK LAUNCH (option 1): change to `if: always()` so the review lands
        # as a downloadable artifact even on success, and drop the post step above.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ai-review-logs-${{ github.run_id }}
          path: |
            review-stderr.log
            /tmp/review_output.txt
          retention-days: 7
          if-no-files-found: ignore
