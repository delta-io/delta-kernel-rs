<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1768" viewBox="0 0 1200 1768"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#334e68"/></marker></defs><rect width="1200" height="1768" fill="white"/><text x="600" y="35" text-anchor="middle" font-family="DejaVu Sans" font-size="26" fill="#17324d">Default metadata scan planning</text><text x="600" y="66" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#52606d">Final p100 candidate; operation-specific log-state borrow; Java left, Rust right</text><path d="M175,126 V1748" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="15" y="85" width="320" height="44" rx="7" fill="#eaf2fb" stroke="#718a9f"/><text x="175" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Java connector / engine</text><path d="M1025,126 V1748" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="865" y="85" width="320" height="44" rx="7" fill="#e5f3ec" stroke="#718a9f"/><text x="1025" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Rust kernel</text><rect x="80" y="150" width="1040" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="177" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Entry: Java owns immutable SnapshotHint and plan executor.</text><text x="600.0" y="201" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Rust owns only SnapshotCore and its validated metadata-scan token.</text><rect x="35" y="249" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="276" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">1. Create a read-only plan engine for this scan call.</text><text x="287.5" y="300" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Open a confined JNR scope for temporary native buffers.</text><rect x="35" y="348" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="375" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">2. Pack FfiSnapshotLogState: version, freshness,</text><text x="287.5" y="399" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">log paths and checkpoint hint only.</text><text x="287.5" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">No table schema, metadata, protocol or CRC payload.</text><text x="600" y="485" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">3. snapshot_core_declarative_metadata_plan_from_log_state(</text><text x="600" y="509" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">core, logState, generation, planEngine)</text><path d="M175,525 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="567" width="505" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="594" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Check generation, version and freshness.</text><text x="912.5" y="618" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Borrow log state for this FFI call only.</text><text x="912.5" y="642" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Use the handoff validation token.</text><rect x="660" y="690" width="505" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="717" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">4. Decode paths and checkpoint hint.</text><text x="912.5" y="741" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Create a scoped LogSegment.</text><text x="912.5" y="765" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">No table schema, TableConfiguration or StateInfo.</text><text x="600" y="827" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">5. Engine callbacks for checkpoint shape and I/O</text><path d="M1025,843 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="885" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="912" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Java plan executor performs checkpoint I/O.</text><text x="287.5" y="936" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Checkpoint shape work remains operation scoped.</text><text x="600" y="998" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return checkpoint inputs to Rust</text><path d="M175,1014 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1056" width="505" height="122" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1083" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">6. Build MetadataScanPlan.</text><text x="912.5" y="1107" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Serialize the Operation protobuf.</text><text x="912.5" y="1131" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Drop scoped log, checkpoint and plan inputs.</text><text x="912.5" y="1155" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Keep result bytes until Java finishes decoding.</text><text x="600" y="1217" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return KernelOwnedBytes (pointer + length)</text><path d="M1025,1233 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="1275" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="1302" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">7. Decode protobuf directly from native memory.</text><text x="287.5" y="1326" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Free result bytes; close JNR scope and plan engine.</text><text x="600" y="1388" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">jnr_free_kernel_bytes(pointer, length)</text><path d="M175,1404 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1446" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1473" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Free serialized result buffer.</text><text x="912.5" y="1497" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">SnapshotCore remains; no Rust Scan or engine is retained.</text><rect x="80" y="1545" width="1040" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="1572" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Per fleet scan: 1,107 plans, 5,535 downcalls and 54.5 MB of path UTF-8.</text><text x="600.0" y="1596" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Schema bytes copied during scan: zero. Cleanup returns Rust and JNR to baseline.</text><rect x="80" y="1644" width="1040" height="74" rx="8" fill="#fff3d8" stroke="#90a5b5"/><text x="600.0" y="1671" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Fallback for a core without a validation token uses the full hint path.</text><text x="600.0" y="1695" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Explicit schema getters remain separate and return owned Rust values.</text></svg>