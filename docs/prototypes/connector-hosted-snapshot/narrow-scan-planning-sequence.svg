<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1864" viewBox="0 0 1200 1864"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#334e68"/></marker></defs><rect width="1200" height="1864" fill="white"/><text x="600" y="35" text-anchor="middle" font-family="DejaVu Sans" font-size="26" fill="#17324d">Default metadata scan planning</text><text x="600" y="66" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#52606d">Current narrow candidate: one scoped hint borrow; Java left, Rust right</text><path d="M175,126 V1844" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="15" y="85" width="320" height="44" rx="7" fill="#eaf2fb" stroke="#718a9f"/><text x="175" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Java connector / engine</text><path d="M1025,126 V1844" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="865" y="85" width="320" height="44" rx="7" fill="#e5f3ec" stroke="#718a9f"/><text x="1025" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Rust kernel</text><rect x="80" y="150" width="1040" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="177" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Entry: Java owns immutable SnapshotHint + generation; Rust owns the small core.</text><text x="600.0" y="201" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">This path supports JSON stats, string partition values and no predicate.</text><rect x="35" y="249" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="276" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">1. scanPlan() opens a confined JNR scope.</text><text x="287.5" y="300" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Convert paths to kernel URLs; encode/copy strings.</text><text x="287.5" y="324" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Pack full hint, including unused schema JSON.</text><text x="600" y="386" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">2. snapshot_core_declarative_metadata_plan(core, hint, generation, engine)</text><path d="M175,402 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="444" width="505" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="471" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Check core generation, version and freshness.</text><text x="912.5" y="495" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Borrow SnapshotState for this FFI call only.</text><text x="912.5" y="519" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Use the handoff validation token; check identity.</text><rect x="660" y="567" width="505" height="122" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="594" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">3. Decode log paths and checkpoint hint.</text><text x="912.5" y="618" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Create scoped LogSegment.</text><text x="912.5" y="642" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">No metadata/protocol/table-schema getter;</text><text x="912.5" y="666" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">no TableConfiguration or StateInfo construction.</text><text x="600" y="728" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">4. Engine callback: discover checkpoint shape, when needed</text><path d="M1025,744 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="786" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="813" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Java plan executor handles checkpoint I/O.</text><text x="287.5" y="837" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Read the checkpoint schema required for shape.</text><text x="287.5" y="861" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">This is distinct from materializing the table schema.</text><text x="600" y="923" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return checkpoint-shape inputs to Rust</text><path d="M175,939 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="981" width="505" height="122" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1008" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">5. Build MetadataScanPlan from narrow inputs.</text><text x="912.5" y="1032" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Construct plan IR and serialize Operation protobuf.</text><text x="912.5" y="1056" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Drop scoped log / shape / plan inputs;</text><text x="912.5" y="1080" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">keep the owned result buffer until explicitly freed.</text><text x="600" y="1142" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return optional KernelOwnedBytes (pointer + length)</text><path d="M1025,1158 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="1200" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="1227" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">6. Wrap bytes with a direct ByteBuffer.</text><text x="287.5" y="1251" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Parse protobuf into the Java Plan.</text><text x="287.5" y="1275" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Decode while the native result remains valid.</text><text x="600" y="1337" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">7. finally: jnr_free_kernel_bytes(pointer, length)</text><path d="M175,1353 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1395" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1422" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Free serialized result buffer.</text><text x="912.5" y="1446" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Core and validation token remain alive.</text><rect x="35" y="1494" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="1521" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">8. Close JNR scope; free hint input buffers.</text><text x="287.5" y="1545" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return Java Plan; retain immutable hint.</text><text x="287.5" y="1569" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Benchmark calls getSerializedSize() inside timer.</text><rect x="80" y="1617" width="1040" height="98" rx="8" fill="#fff3d8" stroke="#90a5b5"/><text x="600.0" y="1644" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Failure paths: identity mismatch returns an error before planning.</text><text x="600.0" y="1668" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">If the core has no scan-validation token, use the existing fallible planner;</text><text x="600.0" y="1692" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">that fallback can materialize schemas and preserves scan-validation errors.</text><rect x="80" y="1740" width="1040" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="1767" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">No persistent Rust Scan is created by this valid default path.</text><text x="600.0" y="1791" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Explicit schema getters are separate operations and still return an owned schema.</text></svg>