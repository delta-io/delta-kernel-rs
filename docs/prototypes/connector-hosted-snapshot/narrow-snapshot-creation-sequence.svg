<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2002" viewBox="0 0 1200 2002"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#334e68"/></marker></defs><rect width="1200" height="2002" fill="white"/><text x="600" y="35" text-anchor="middle" font-family="DejaVu Sans" font-size="26" fill="#17324d">Snapshot creation and validated handoff</text><text x="600" y="66" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#52606d">Current p100 candidate: actual harness lifecycle; calls are grouped for readability</text><path d="M175,126 V1982" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="15" y="85" width="320" height="44" rx="7" fill="#eaf2fb" stroke="#718a9f"/><text x="175" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Java connector / engine</text><path d="M1025,126 V1982" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="865" y="85" width="320" height="44" rx="7" fill="#e5f3ec" stroke="#718a9f"/><text x="1025" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Rust kernel</text><text x="600" y="164" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">1. TableManager.loadSnapshot(table)</text><path d="M175,180 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="222" width="505" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="249" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Load log state through engine callbacks.</text><text x="912.5" y="273" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Build source Snapshot + TableConfiguration;</text><text x="912.5" y="297" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">parse and validate logical/physical schemas.</text><text x="600" y="359" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return source snapshot handle</text><path d="M1025,375 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="431" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">2. Read version, metadata and protocol from source</text><path d="M175,447 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="503" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return components to Java</text><path d="M1025,519 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="561" width="505" height="98" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="588" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Harness lists fixture log paths in Java.</text><text x="287.5" y="612" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Construct immutable SnapshotHint.</text><text x="287.5" y="636" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Source native snapshot remains alive.</text><rect x="35" y="684" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="711" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">3. Pack full hint into scoped JNR buffers.</text><text x="287.5" y="735" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Encode strings as UTF-8 and copy to native memory.</text><text x="600" y="797" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_builder_set_snapshot_hint(builder, hint)</text><path d="M175,813 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="855" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="882" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Copy hint into native builder-owned state.</text><text x="912.5" y="906" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">JNR input buffers can be released after setter.</text><text x="600" y="968" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_builder_build(builder)</text><path d="M175,984 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1026" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1053" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Build and validate the hinted Snapshot.</text><text x="912.5" y="1077" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Source and hinted native snapshots overlap.</text><text x="600" y="1139" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return hinted snapshot handle</text><path d="M1025,1155 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="1197" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="1224" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">4. Pack full hint again for handoff.</text><text x="287.5" y="1248" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Pass caller generation (version in this harness).</text><text x="600" y="1310" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_externalize_core(hinted, hint, generation, engine)</text><path d="M175,1326 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1368" width="505" height="122" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1395" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Compare full connector state with hinted snapshot.</text><text x="912.5" y="1419" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Check nonempty schema and scan feature support.</text><text x="912.5" y="1443" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Validate explicit metadata-column scan rules.</text><text x="912.5" y="1467" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Create small core + optional scan-validation token.</text><text x="600" y="1529" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return core handle; handoff input buffers can be freed</text><path d="M1025,1545 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="1601" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">5. externalize() closes hinted snapshot: free_snapshot</text><path d="M175,1617 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1673" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">6. Harness exits source scope: free_snapshot</text><path d="M175,1689 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="1731" width="1040" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="1758" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Between calls: Java retains immutable hint, generation, engine and core handle.</text><text x="600.0" y="1782" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Rust retains core identity + validation token and engine/context allocations.</text><text x="600.0" y="1806" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Full native snapshots are released; initial load/handoff still materializes them.</text><rect x="80" y="1854" width="1040" height="98" rx="8" fill="#fff3d8" stroke="#90a5b5"/><text x="600.0" y="1881" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Failure: a handoff mismatch returns an error without consuming the snapshot.</text><text x="600.0" y="1905" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">A scan-invalid snapshot may still externalize for getters; its core has no scan token.</text><text x="600.0" y="1929" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">The generation must remain immutable; unchanged-ID mutations are not detected.</text></svg>