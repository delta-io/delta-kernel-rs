<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1759" viewBox="0 0 1200 1759"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#334e68"/></marker></defs><rect width="1200" height="1759" fill="white"/><text x="600" y="35" text-anchor="middle" font-family="DejaVu Sans" font-size="26" fill="#17324d">Snapshot construction and validated handoff</text><text x="600" y="66" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#52606d">Final p100 candidate; Java left, Rust right; calls grouped for readability</text><path d="M175,126 V1739" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="15" y="85" width="320" height="44" rx="7" fill="#eaf2fb" stroke="#718a9f"/><text x="175" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Java connector / engine</text><path d="M1025,126 V1739" stroke="#a7b7c5" stroke-dasharray="6 6"/><rect x="865" y="85" width="320" height="44" rx="7" fill="#e5f3ec" stroke="#718a9f"/><text x="1025" y="113" text-anchor="middle" font-family="DejaVu Sans" font-size="19">Rust kernel</text><text x="600" y="164" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">1. Load source snapshot with the construction engine</text><path d="M175,180 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="222" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="249" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Read log state and materialize one native Snapshot.</text><text x="912.5" y="273" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Validate protocol, metadata, logical and physical schemas.</text><text x="600" y="335" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return source snapshot handle</text><path d="M1025,351 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="407" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">2. Read immutable components used to build SnapshotHint</text><path d="M175,423 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="479" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return version, metadata and protocol</text><path d="M1025,495 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="537" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="564" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Create immutable SnapshotHint and retain its identity.</text><text x="287.5" y="588" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Close source snapshot before building the hinted snapshot.</text><rect x="35" y="636" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="663" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">3. Pack the full hint once into a confined JNR scope.</text><text x="287.5" y="687" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">The setter copies it into native builder-owned state.</text><text x="600" y="749" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_builder_set_snapshot_hint(builder, exactHint)</text><path d="M175,765 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="821" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_builder_build(builder)</text><path d="M175,837 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="879" width="505" height="74" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="906" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Build and validate the hinted native Snapshot.</text><text x="912.5" y="930" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Record the exact Java hint identity on JnrSnapshot.</text><text x="600" y="992" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return hinted snapshot handle</text><path d="M1025,1008 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="1050" width="505" height="74" rx="8" fill="#eaf2fb" stroke="#90a5b5"/><text x="287.5" y="1077" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">4. externalize(hinted, exactHint, generation)</text><text x="287.5" y="1101" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Identity match proves this is the state used by the builder.</text><text x="600" y="1163" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">snapshot_externalize_validated_core(snapshot, generation)</text><path d="M175,1179 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="1221" width="505" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="912.5" y="1248" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Retain root, version, freshness and generation.</text><text x="912.5" y="1272" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Retain a compact validated metadata-scan token.</text><text x="912.5" y="1296" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">No second hint pack or full component comparison.</text><text x="600" y="1358" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Return SnapshotCore handle</text><path d="M1025,1374 H175" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="1430" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">5. Close hinted snapshot and construction engine</text><path d="M175,1446 H1025" fill="none" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="1488" width="1040" height="98" rx="8" fill="#e5f3ec" stroke="#90a5b5"/><text x="600.0" y="1515" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Between calls: Java retains SnapshotHint + plan executor + core handle.</text><text x="600.0" y="1539" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Rust retains SnapshotCore only: 741,192 B for 1,107 snapshots.</text><text x="600.0" y="1563" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Construction engine, source snapshot and hinted snapshot are released.</text><rect x="80" y="1611" width="1040" height="98" rx="8" fill="#fff3d8" stroke="#90a5b5"/><text x="600.0" y="1638" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Fallback: a different hint object takes the full comparison path.</text><text x="600.0" y="1662" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">Generation, version and freshness are rechecked on later calls.</text><text x="600.0" y="1686" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#17324d">An unchanged generation cannot protect against connector mutation.</text></svg>