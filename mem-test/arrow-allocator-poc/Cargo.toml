[workspace]

[package]
name = "kernel-arrow-allocator-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["declarative-benchmark"]
declarative-benchmark = []

[dependencies]
arrow-buffer = "=60.0.0"
delta_kernel = { path = "../../kernel", features = ["arrow-60", "default-engine-base", "internal-api", "test-utils", "declarative-plans", "vendored-protoc"] }
delta_kernel_default_engine = { path = "../../default-engine", features = ["rustls"] }
test_utils = { path = "../../test-utils", default-features = false, features = ["arrow-60"] }
dhat = "0.3"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
url = "2"

[[bin]]
name = "kernel_lifecycle"
path = "heap.rs"

[[bin]]
name = "rss_lifecycle"
path = "rss.rs"

[[bin]]
name = "allocation_checks"
path = "checks.rs"

[[bin]]
name = "fault_probe"
path = "fault.rs"
