[package]
name = "mem-test"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

# for cargo-release
[package.metadata.release]
release = false

[features]
default = ["arrow"]
arrow = ["arrow-60"]
arrow-60 = ["delta_kernel/arrow-60", "test_utils/arrow-60"]
arrow-59 = ["delta_kernel/arrow-59", "test_utils/arrow-59"]

memory-benchmark = ["delta_kernel/internal-api", "delta_kernel/test-utils"]
declarative-benchmark = ["memory-benchmark", "delta_kernel/declarative-plans", "delta_kernel/vendored-protoc"]

[[example]]
name = "kernel_lifecycle"
required-features = ["memory-benchmark"]

[[example]]
name = "rss_lifecycle"
required-features = ["memory-benchmark"]

[dependencies]
delta_kernel = { path = "../kernel", features = ["default-engine-base"] }
delta_kernel_default_engine = { path = "../default-engine", features = ["rustls"] }
dhat = "0.3"
rayon = "1.10"
serde_json = "1"
tempfile = "3"
tracing = "0.1"
url = "2"

[dev-dependencies]
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
test_utils = { path = "../test-utils", default-features = false }
