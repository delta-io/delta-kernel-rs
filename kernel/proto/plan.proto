// Wire representation of the validated declarative-plan IR.
//
// A plan is a DAG of plan nodes: `Plan` is a flat list of `PlanNode`s, and each node wires
// into the DAG by referencing other nodes' positions (indices into `Plan.nodes`) in its
// `inputs`. A node is identified by its index; the terminal node is the last entry. Field
// numbers are never reused once published, so the wire stays compatible.

syntax = "proto3";

package delta.kernel.plan;

// Java package for generated bindings. Ignored by prost (Rust codegen).
option java_package = "io.delta.kernel.proto.plan";

import "expressions.proto";
import "schema.proto";

message FileMeta {
  string location = 1;
  uint64 size = 2;
  int64 last_modified = 3;  // milliseconds since epoch
}

// ============================================================================
// Source payloads (0 inputs)
// ============================================================================

message ScanFile {
  FileMeta meta = 1;
  repeated delta.kernel.expressions.Scalar file_constants = 2;
}

message ScanParquetNode {
  repeated ScanFile files = 1;
  repeated string file_constant_columns = 2;
  delta.kernel.schema.StructType schema = 3;
}

message ScanJsonNode {
  repeated ScanFile files = 1;
  repeated string file_constant_columns = 2;
  delta.kernel.schema.StructType schema = 3;
}

message ValuesRow {
  repeated delta.kernel.expressions.Scalar values = 1;
}
message ValuesNode {
  delta.kernel.schema.StructType schema = 1;
  repeated ValuesRow rows = 2;
}

// ============================================================================
// Transform payloads (1+ inputs)
// ============================================================================

message ProjectNode {
  delta.kernel.expressions.PlanExpression expr = 1;
  delta.kernel.schema.StructType schema = 2;
}

message FilterNode {
  delta.kernel.expressions.PlanPredicate predicate = 1;
}

// Optional analysis input for conservative file pruning. Ignoring this node is identity.
message DataSkippingStats {
  delta.kernel.schema.StructType source_schema = 1;
  delta.kernel.expressions.ColumnName stats_column = 2;
  delta.kernel.expressions.ColumnName partition_values_column = 3;
}

message DataSkippingTarget {
  oneof target {
    bool adds_only = 1;
    delta.kernel.expressions.ColumnName is_add = 2;
  }
}

message DataSkippingNode {
  // This broad predicate is analysis input, not an expression the executor must evaluate.
  delta.kernel.expressions.Predicate source_predicate = 1;
  DataSkippingStats stats = 2;
  DataSkippingTarget target = 3;
  // For mixed-action targets, this predicate includes the guard that retains non-Add rows.
  delta.kernel.expressions.PlanPredicate kernel_keep_predicate = 4;
}

message UnionAllNode {}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_PARQUET = 1;
  FILE_TYPE_JSON = 2;
}

message DynamicScanNode {
  delta.kernel.schema.StructType schema = 1;
  FileType file_type = 2;
  // Hierarchical base URL ending in `/` that relative file paths resolve against.
  string base_url = 3;
  repeated string file_constant_columns = 4;
  // Required input columns: path is STRING; size and last-modified are LONG.
  // Each column and every ancestor in its path must be non-nullable.
  delta.kernel.expressions.ColumnName path_column = 5;
  delta.kernel.expressions.ColumnName file_size_column = 6;
  delta.kernel.expressions.ColumnName last_modified_column = 7;
  delta.kernel.expressions.ColumnName dv_column = 8;
}

message MinAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message MaxAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message SumAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message CountAgg {
  delta.kernel.expressions.ColumnName value = 1;
}
message CountStarAgg {}
message MinNonNullByAgg {
  delta.kernel.expressions.ColumnName value = 1;
  delta.kernel.expressions.ColumnName null_sentinel = 2;
  delta.kernel.expressions.ColumnName key = 3;
}
message MaxNonNullByAgg {
  delta.kernel.expressions.ColumnName value = 1;
  delta.kernel.expressions.ColumnName null_sentinel = 2;
  delta.kernel.expressions.ColumnName key = 3;
}

message Agg {
  oneof func {
    MinAgg min = 1;
    MaxAgg max = 2;
    MinNonNullByAgg min_non_null_by = 3;
    MaxNonNullByAgg max_non_null_by = 4;
    SumAgg sum = 5;
    CountAgg count = 6;
    CountStarAgg count_star = 7;
  }
}

message AggregateNode {
  repeated delta.kernel.expressions.ColumnName group_by = 1;
  repeated Agg aggs = 2;
  delta.kernel.schema.StructType schema = 3;
}

message SemiJoinNode {
  bool inverted = 1;
  repeated delta.kernel.expressions.ColumnName probe_keys = 2;
  repeated delta.kernel.expressions.ColumnName build_keys = 3;
}

// ============================================================================
// Operator
// ============================================================================

message Operator {
  oneof op {
    // Sources (0 inputs)
    ScanParquetNode scan_parquet = 1;
    ScanJsonNode scan_json = 2;
    ValuesNode values = 3;
    // Transforms (1+ inputs)
    ProjectNode project = 4;
    FilterNode filter = 5;
    UnionAllNode union_all = 6;
    DynamicScanNode dynamic_scan = 7;
    AggregateNode aggregate = 8;
    SemiJoinNode semi_join = 9;
    DataSkippingNode data_skipping = 10;
  }
}

// ============================================================================
// PlanNode / Plan
// ============================================================================

message PlanNode {
  Operator op = 1;
  // Indices into `Plan.nodes` of this node's upstream inputs. Each index is strictly less than
  // this node's own index, so `nodes` can be evaluated in order.
  repeated uint32 inputs = 2;
}

// The plan's terminal node is its last entry; the engine streams that node's rows.
message Plan {
  repeated PlanNode nodes = 1;
}
