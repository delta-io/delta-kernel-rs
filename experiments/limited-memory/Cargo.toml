[package]
name = "delta-kernel-limited-memory-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Keep the allocator experiment independent of Kernel's MSRV and feature matrix.
[workspace]

[features]
declarative-benchmark = ["delta_kernel/declarative-plans", "delta_kernel/vendored-protoc"]

[dependencies]
delta_kernel = { path = "../../kernel", features = ["internal-api", "limited-memory", "test-utils", "default-engine-base", "arrow-60"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
dhat = "0.3"
libc = "0.2"
futures = "0.3"
test_utils = { path = "../../test-utils", default-features = false, features = ["arrow-60"] }

[profile.release]
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
