id: kernel-test-sorted-batch-helper
language: Rust
severity: warning
message: Consider assert_batches_sorted_eq! instead of manual pretty-formatting and row sorting.
note: 'Review-only: this test function pretty-prints batches and normalizes a Vec of complete trim().lines() before
  sorting. Confirm the same table rendering and ignored row/batch order before using the shared macro. Expected
  lines must remain sorted separately. Keep typed/schema/null/order/batch-boundary assertions and custom filtered-row
  comparisons.'
rule:
  all:
  - pattern: pretty_format_batches($BATCHES)
  - inside:
      kind: function_item
      all:
      - has:
          any:
          - pattern: 'let mut $LINES: Vec<$TYPE> = $TEXT.trim().lines().collect();'
          - pattern: 'let mut $LINES: Vec<$TYPE> = $TEXT.trim().lines().map(str::to_string).collect();'
          stopBy: end
      - has:
          any:
          - pattern: $LINES.sort_unstable()
          - pattern: $LINES[$RANGE].sort_unstable()
          stopBy: end
      stopBy: end
  - matches: test-scope
utils:
  test-scope:
    any:
    - inside:
        kind: mod_item
        regex: (?s)^(pub(?:\([^)]*\))?\s+)?mod\s+tests\b
        stopBy: end
    - inside:
        kind: function_item
        follows:
          kind: attribute_item
          regex: ^#\[(test|tokio::test|rstest::rstest)(\b|\()
          stopBy:
            not:
              kind: attribute_item
        stopBy: end
