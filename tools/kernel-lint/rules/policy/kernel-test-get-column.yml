id: kernel-test-get-column
language: Rust
severity: warning
message: Prefer test_utils::get_column! for the named Arrow column lookup and downcast.
note: Test-only candidate requiring an Arrow RecordBatch/StructArray receiver and concrete array type. Keep typed/value/null/schema/order
  assertions after lookup and custom diagnostics. Name is constrained to a literal; verify the receiver/type and
  macro import before fixing.
rule:
  all:
  - pattern: $BATCH.column_by_name($NAME).unwrap().as_any().downcast_ref::<$TYPE>().unwrap()
  - matches: test-scope
utils:
  test-scope:
    any:
    - inside:
        kind: mod_item
        regex: (?s)^(pub(?:\([^)]*\))?\s+)?mod\s+tests\b
        stopBy: end
    - inside:
        kind: function_item
        follows:
          kind: attribute_item
          regex: ^#\[(test|tokio::test|rstest::rstest)(\b|\()
          stopBy:
            not:
              kind: attribute_item
        stopBy: end
constraints:
  NAME:
    kind: string_literal
  TYPE:
    regex: ^(?:[A-Za-z_][A-Za-z0-9_]*::)*[A-Za-z_][A-Za-z0-9_]*Array$
fix: test_utils::get_column!($BATCH, $NAME, $TYPE)
