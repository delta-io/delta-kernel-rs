id: kernel-policy-no-control-flow-arguments
valid:
- 'fn f() { if condition { first(); } else { second(); } }'
- 'fn f() { let value = match input { Some(value) => value, None => 0 }; consume(value); }'
- 'fn f() { consume(|| if condition { first() } else { second() }); }'
- 'fn f() { consume(move || match input { Some(value) => value, None => 0 }); }'
- 'fn f() { values.map(|value| if value > 0 { value } else { 0 }); }'
- 'fn f() { values.map(|value| match value { Some(inner) => inner, None => 0 }); }'
- 'fn f() { consume({ if condition { first() } else { second() } }); }'
- 'fn f() { consume({ let value = match input { Some(value) => value, None => 0 }; value }); }'
- 'fn f() { (if condition { first() } else { second() }).method(); }'
- 'fn f() { consume((if condition { first() } else { second() }).method()); }'
- 'fn f() { consume((match input { Some(value) => value, None => 0 }).method()); }'
- 'fn f() { consume(1 + if condition { 2 } else { 3 }); }'
- 'fn f() { consume((if condition { first() } else { second() }).await); }'
- 'fn f() { consume::<{ if condition { 1 } else { 2 } }>(); }'
- 'fn f(value: [u8; if true { 1 } else { 2 }]) {}'
- 'fn f(value: [u8; const_helper(if true { 1 } else { 2 })]) {}'
- 'fn f<const N: usize = { const_helper(if true { 1 } else { 2 }) }>() {}'
- 'fn f() { wrapper!(consume(if condition { first() } else { second() })); }'
- 'fn f() { assert_eq!(actual, if condition { first() } else { second() }); }'
- 'macro_rules! helper { () => { consume(match input { Some(value) => value, None => 0 }) }; }'
- '#[attribute(consume(if condition { first() } else { second() }))] fn f() {}'
- '/// consume(if condition { first() } else { second() })

  fn f(value: Thing) -> Other { todo!() }'
- 'fn f() { let text = "consume(if condition { first() } else { second() })"; }'
- 'fn f() { consume(loop { break if condition { first() } else { second() }; }); }'
invalid:
- 'fn f() { consume(if condition { first() } else { second() }); }'
- 'fn f() { consume(match input { Some(value) => value, None => 0 }); }'
- 'fn f() { consume(if let Some(value) = input { value } else { 0 }); }'
- 'fn f() { object.method(if condition { first() } else { second() }); }'
- 'fn f() { object.method::<Type>(match input { Some(value) => value, None => 0 }); }'
- 'fn f() { consume::<Type>(if condition { first() } else { second() }); }'
- 'fn f() { consume(((if condition { first() } else { second() }))); }'
- 'fn f() { consume(&(match input { Some(value) => value, None => 0 })); }'
- 'fn f() { consume((if condition { Ok(first()) } else { Err(error) })?); }'
- 'fn f() { consume(first(), if condition { second() } else { third() }); }'
- 'fn f() { consume(if first { one() } else if second { two() } else { three() }); }'
- 'fn f() { consume(match input { Some(value) => if condition { value } else { 0 }, None => 0 }); }'
- 'fn f() { outer(inner(match input { Some(value) => value, None => 0 })); }'
- 'fn f() { consume(|| inner(match input { Some(value) => value, None => 0 })); }'
- 'fn f() { consume(if condition { inner(match input { Some(value) => value, None => 0 }) } else { 0 }); }'
